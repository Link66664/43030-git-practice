name: CI Workflow

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t vowel-frequency-analyzer:latest .

      - name: Run Docker Container
        run: docker run --rm -e GITHUB_USER="${{ github.actor }}" -v ${{ github.workspace }}:/app vowel-frequency-analyzer:latest

      - name: Commit README Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README with vowel frequency result" || echo "No changes to commit"
          git push
